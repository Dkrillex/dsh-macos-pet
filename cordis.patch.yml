# DSH bundle layer: mount the host plugin that launches the desktop pet.
#
# `name` is the module specifier DSH imports (vendor/loader entry.ts resolves
# `options.name`), so it has to be the published package name. Renaming the
# package without this line is what makes the plugin silently fail to load.
- insert:
    - id: dsh-macos-pet
      name: dsh-macos-pet
